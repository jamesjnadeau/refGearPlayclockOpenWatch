; refGear Playclock for the Open-Smartwatch Light.
;
; Arduino-ESP32 under PlatformIO, matching the platform pin the OSW OS itself
; builds with (espressif32@6.8.1, board pico32) so anything proven there about
; this hardware carries over. The drawing code is Adafruit_GFX, as it has been
; through every generation of this firmware; the panel driver is Adafruit's
; GC9A01A backend, pushed through a 1-bit canvas in src/RefPanel.cpp.

[platformio]
src_dir = src

[env:playclock]
platform = espressif32@6.8.1
board = pico32                   ; the OSW Light's ESP32-PICO-D4
framework = arduino
monitor_speed = 115200

; VERSIONS READ OFF THE REGISTRY, 2026-08-28, not guessed: Adafruit GC9A01A
; resolves to 1.1.0 and Adafruit GFX to 1.12.x. BusIO is GFX's own
; dependency, pinned so a registry hiccup cannot resolve it differently.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit GC9A01A@^1.1.0
    adafruit/Adafruit BusIO@^1.16.1

; Warnings on OUR sources only. build_src_flags rather than build_flags,
; because the ESP32 core and the Adafruit libraries are not warning-clean and
; drowning our own output in theirs is how a real warning gets missed. Most of
; src/ is compiled twice -- once here and once by test/run.sh, which is -Wall
; -Wextra -Werror from the start -- but the files that touch the panel or the
; pins are compiled ONLY here.
build_src_flags =
    -Wall
    -Wextra

; Flashing: the OSW Light exposes the ESP32's UART0 on its edge connector;
; hold the bottom-left button (GPIO 0, the BOOT strap) and tap the top-left
; RESET to enter the ROM serial bootloader, exactly as the OSW documentation
; describes. `pio run -t upload` with the adapter attached does the rest.
